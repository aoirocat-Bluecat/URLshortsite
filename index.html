<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL短縮ツール</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        input[type="url"], input[type="text"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .error {
            color: #d9534f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .copy-btn {
            background-color: #28a745;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>URL短縮ツール</h1>
    <input type="url" id="longUrl" placeholder="短くしたいURLを入力 (https://...)" required>
    <button onclick="shortenUrl()">URLを短縮する</button>
    <div id="errorMessage" class="error">有効なURLを入力してください。</div>

    <div class="result-box" id="resultBox">
        <p>短縮されたURL:</p>
        <input type="text" id="shortUrl" readonly>
        <button class="copy-btn" onclick="copyUrl()">コピーする</button>
    </div>
</div>

<script>
    // 1. APIからデータを受け取るための専用の関数（JSONP用）
    function handleIsGdResponse(data) {
        const resultBox = document.getElementById('resultBox');
        const shortUrlInput = document.getElementById('shortUrl');

        // URLが正しく返ってきた場合
        if (data.shorturl) {
            shortUrlInput.value = data.shorturl;
            resultBox.style.display = 'block';
        } else {
            // エラーが返ってきた場合
            alert('短縮に失敗しました。別のURLをお試しください。');
        }
    }

    function shortenUrl() {
        const longUrl = document.getElementById('longUrl').value;
        const resultBox = document.getElementById('resultBox');
        const errorMessage = document.getElementById('errorMessage');

        // 入力チェック
        if (!longUrl || !longUrl.startsWith('http')) {
            errorMessage.style.display = 'block';
            resultBox.style.display = 'none';
            return;
        }
        errorMessage.style.display = 'none';

        // 2. fetchの代わりに、scriptタグを作って通信する（CORSエラー回避のため）
        const script = document.createElement('script');
        // URLの最後に &callback=handleIsGdResponse を付けるのがポイントです
        script.src = `https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}&callback=handleIsGdResponse`;
        
        // もしネットワーク自体が切れていた場合のエラー処理
        script.onerror = function() {
            alert('通信エラーが発生しました。インターネット接続を確認してください。');
        };

        // HTMLにscriptタグを追加して通信を実行
        document.body.appendChild(script);
        
        // 通信が終わったら不要になったscriptタグを削除
        script.onload = function() {
            document.body.removeChild(script);
        };
    }

    // コピー機能
    function copyUrl() {
        const shortUrl = document.getElementById('shortUrl').value;
        navigator.clipboard.writeText(shortUrl).then(() => {
            alert('クリップボードにコピーしました！');
        }).catch(err => {
            alert('コピーに失敗しました。手動でコピーしてください。');
        });
    }
</script>

</body>
</html>
