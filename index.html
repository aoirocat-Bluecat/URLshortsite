<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL短縮ツール</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        input[type="url"], input[type="text"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .error {
            color: #d9534f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .copy-btn {
            background-color: #28a745;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>URL短縮ツール</h1>
    <!-- URLは必ず http:// か https:// から始まる必要があります -->
    <input type="url" id="longUrl" placeholder="短くしたいURL (https://...)" required>
    <button onclick="shortenUrl()" id="submitBtn">URLを短縮する</button>
    <div id="errorMessage" class="error">有効なURL（http〜）を入力してください。</div>

    <div class="result-box" id="resultBox">
        <p>短縮されたURL:</p>
        <input type="text" id="shortUrl" readonly>
        <button class="copy-btn" onclick="copyUrl()">コピーする</button>
    </div>
</div>

<script>
    async function shortenUrl() {
        const longUrl = document.getElementById('longUrl').value;
        const resultBox = document.getElementById('resultBox');
        const errorMessage = document.getElementById('errorMessage');
        const shortUrlInput = document.getElementById('shortUrl');
        const submitBtn = document.getElementById('submitBtn');

        // 入力チェック (httpから始まっているか)
        if (!longUrl || !longUrl.startsWith('http')) {
            errorMessage.style.display = 'block';
            resultBox.style.display = 'none';
            return;
        }
        errorMessage.style.display = 'none';

        // 処理中はボタンの文字を変える
        submitBtn.innerText = "短縮中...";
        submitBtn.disabled = true;

        try {
            // is.gdのAPI URL
            const targetApiUrl = `https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`;
            
            // 仲介サーバー（allorigins）を経由してエラーやブロックを回避する
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetApiUrl)}`;

            const response = await fetch(proxyUrl);
            const data = await response.json();
            
            // 仲介サーバーが取得した中身(文字列)をプログラム用に変換
            const result = JSON.parse(data.contents);

            if (result.shorturl) {
                shortUrlInput.value = result.shorturl;
                resultBox.style.display = 'block';
            } else {
                alert('短縮に失敗しました。このURLはサポートされていない可能性があります。');
            }
        } catch (error) {
            alert('通信エラーが発生しました。ブラウザのセキュリティ設定や広告ブロッカーが影響している可能性があります。');
            console.error(error);
        } finally {
            // ボタンを元の状態に戻す
            submitBtn.innerText = "URLを短縮する";
            submitBtn.disabled = false;
        }
    }

    // コピー機能
    function copyUrl() {
        const shortUrl = document.getElementById('shortUrl').value;
        navigator.clipboard.writeText(shortUrl).then(() => {
            alert('クリップボードにコピーしました！');
        }).catch(err => {
            alert('コピーに失敗しました。手動でコピーしてください。');
        });
    }
</script>

</body>
</html>
