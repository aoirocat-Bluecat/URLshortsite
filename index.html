<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL短縮ツール</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow-x: hidden; 
            position: relative; 
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        input[type="url"], input[type="text"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="url"]:focus, input[type="text"]:focus {
            border-color: #007BFF;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .result-box {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .error {
            color: #d9534f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .copy-btn {
            background-color: #28a745;
        }
        .copy-btn:hover {
            background-color: #218838;
        }

        /* --- バージョン表記 --- */
        .version-info {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: #999;
            font-size: 12px;
            pointer-events: none;
        }

        /* --- Windows 11風 トースト通知 --- */
        .toast {
            position: fixed;
            bottom: 34px; 
            right: 24px;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); 
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 16px 20px;
            width: 280px;
            border-left: 4px solid #007BFF; 
            transform: translateX(120%); 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 1000;
            text-align: left;
        }
        .toast.show {
            transform: translateX(0); 
        }
        .toast.error-toast {
            border-left-color: #d9534f; 
        }
        .toast-title {
            font-weight: 600;
            font-size: 15px;
            color: #202020;
            margin-bottom: 4px;
        }
        .toast-message {
            font-size: 13px;
            color: #555555;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>URL短縮ツール</h1>
    <input type="url" id="longUrl" placeholder="短くしたいURLを入力 (https://...)" required>
    <button id="submitBtn" onclick="shortenUrl()">URLを短縮する</button>
    <div id="errorMessage" class="error">有効なURLを入力してください。</div>

    <div class="result-box" id="resultBox">
        <p>短縮されたURL:</p>
        <input type="text" id="shortUrl" readonly>
        <button class="copy-btn" onclick="copyUrl()">コピーする</button>
    </div>
</div>

<!-- バージョンを v1.8 に更新！ -->
<div class="version-info">v1.8</div>

<div id="toast" class="toast">
    <div class="toast-title" id="toastTitle">通知</div>
    <div class="toast-message" id="toastMessage">メッセージ</div>
</div>

<script>
    let toastTimeout;
    function showNotification(title, message, isError = false) {
        const toast = document.getElementById('toast');
        document.getElementById('toastTitle').innerText = title;
        document.getElementById('toastMessage').innerText = message;
        
        if (isError) {
            toast.classList.add('error-toast');
        } else {
            toast.classList.remove('error-toast');
        }

        toast.classList.add('show');
        
        clearTimeout(toastTimeout);
        
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 4000);
    }

    async function shortenUrl() {
        const longUrl = document.getElementById('longUrl').value;
        const resultBox = document.getElementById('resultBox');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const shortUrlInput = document.getElementById('shortUrl');

        if (!longUrl || !longUrl.startsWith('http')) {
            errorMessage.style.display = 'block';
            resultBox.style.display = 'none';
            return;
        }
        errorMessage.style.display = 'none';

        submitBtn.innerText = "短縮中...";
        submitBtn.disabled = true;

        let finalShortUrl = "";

        try {
            // 【大本命】1pt.co API
            // Chromeの厳しいセキュリティ（CORS）に完全対応しているため、プロキシなしで直接通信できます。
            try {
                const res1 = await fetch(`https://api.1pt.co/addURL?long=${encodeURIComponent(longUrl)}`);
                if (res1.ok) {
                    const data1 = await res1.json();
                    if (data1.short) {
                        finalShortUrl = `https://1pt.co/${data1.short}`;
                    }
                }
            } catch (e1) {
                console.warn("1pt.coの通信失敗", e1);
            }

            // 【予備】is.gd ＋ 最も制限の緩いプロキシ
            // 万が一1pt.coがダウンしていた時のためのバックアップ
            if (!finalShortUrl) {
                try {
                    const api2 = `https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`;
                    const res2 = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(api2)}`);
                    if (res2.ok) {
                        const data2 = await res2.json();
                        const parsed = JSON.parse(data2.contents);
                        if (parsed && parsed.shorturl) {
                            finalShortUrl = parsed.shorturl;
                        }
                    }
                } catch (e2) {
                    console.warn("バックアップ通信も失敗", e2);
                }
            }

            // 成功したかどうか判定
            if (finalShortUrl) {
                shortUrlInput.value = finalShortUrl;
                resultBox.style.display = 'block';
                showNotification("短縮完了", "URLの短縮に成功しました！");
            } else {
                throw new Error("API通信ブロック");
            }

        } catch (error) {
            console.error(error);
            showNotification("通信エラー", "ネットワークの設定により通信が遮断されました。", true);
        } finally {
            submitBtn.innerText = "URLを短縮する";
            submitBtn.disabled = false;
        }
    }

    function copyUrl() {
        const shortUrl = document.getElementById('shortUrl').value;
        navigator.clipboard.writeText(shortUrl).then(() => {
            showNotification("コピー完了", "クリップボードにコピーしました！");
        }).catch(err => {
            showNotification("エラー", "コピーに失敗しました。", true);
        });
    }
</script>

</body>
</html>
