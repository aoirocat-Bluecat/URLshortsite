<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL短縮ツール</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow-x: hidden; 
            position: relative; 
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        input[type="url"], input[type="text"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="url"]:focus, input[type="text"]:focus {
            border-color: #007BFF;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .result-box {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .error {
            color: #d9534f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .copy-btn {
            background-color: #28a745;
        }
        .copy-btn:hover {
            background-color: #218838;
        }

        /* --- バージョン表記のスタイル --- */
        .version-info {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: #999;
            font-size: 12px;
            pointer-events: none;
        }

        /* --- Windows 11風 トースト通知のスタイル --- */
        .toast {
            position: fixed;
            bottom: 34px; 
            right: 24px;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); 
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 16px 20px;
            width: 280px;
            border-left: 4px solid #007BFF; 
            transform: translateX(120%); 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 1000;
            text-align: left;
        }
        .toast.show {
            transform: translateX(0); 
        }
        .toast.error-toast {
            border-left-color: #d9534f; 
        }
        .toast-title {
            font-weight: 600;
            font-size: 15px;
            color: #202020;
            margin-bottom: 4px;
        }
        .toast-message {
            font-size: 13px;
            color: #555555;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>URL短縮ツール</h1>
    <input type="url" id="longUrl" placeholder="短くしたいURLを入力 (https://...)" required>
    <button id="submitBtn" onclick="shortenUrl()">URLを短縮する</button>
    <div id="errorMessage" class="error">有効なURLを入力してください。</div>

    <div class="result-box" id="resultBox">
        <p>短縮されたURL:</p>
        <input type="text" id="shortUrl" readonly>
        <button class="copy-btn" onclick="copyUrl()">コピーする</button>
    </div>
</div>

<!-- バージョンを v1.4 に更新 -->
<div class="version-info">v1.4</div>

<div id="toast" class="toast">
    <div class="toast-title" id="toastTitle">通知</div>
    <div class="toast-message" id="toastMessage">メッセージ</div>
</div>

<script>
    let toastTimeout;
    function showNotification(title, message, isError = false) {
        const toast = document.getElementById('toast');
        document.getElementById('toastTitle').innerText = title;
        document.getElementById('toastMessage').innerText = message;
        
        if (isError) {
            toast.classList.add('error-toast');
        } else {
            toast.classList.remove('error-toast');
        }

        toast.classList.add('show');
        
        clearTimeout(toastTimeout);
        
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3500);
    }

    function shortenUrl() {
        const longUrl = document.getElementById('longUrl').value;
        const resultBox = document.getElementById('resultBox');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const shortUrlInput = document.getElementById('shortUrl');

        if (!longUrl || !longUrl.startsWith('http')) {
            errorMessage.style.display = 'block';
            resultBox.style.display = 'none';
            return;
        }
        errorMessage.style.display = 'none';

        // ボタンを押せなくする
        submitBtn.innerText = "短縮中...";
        submitBtn.disabled = true;

        // 通信が被らないよう、一意の関数名を自動生成
        const callbackName = 'jsonp_' + Math.random().toString(36).substr(2, 9);

        // 5秒経っても通信が終わらない場合のフリーズ回避機能
        const fallbackTimeout = setTimeout(() => {
            cleanup();
            showNotification("タイムアウト", "サーバーの応答がありません。時間をおいて試してください。", true);
            submitBtn.innerText = "URLを短縮する";
            submitBtn.disabled = false;
        }, 5000);

        // 通信成功時に実行される処理
        window[callbackName] = function(data) {
            cleanup(); 
            
            if (data.shorturl) {
                shortUrlInput.value = data.shorturl;
                resultBox.style.display = 'block';
                showNotification("短縮完了", "URLの短縮に成功しました！");
            } else {
                showNotification("エラー", "短縮に失敗しました。別のURLをお試しください。", true);
            }
            
            submitBtn.innerText = "URLを短縮する";
            submitBtn.disabled = false;
        };

        // ★ 修正箇所： format=json ではなく format=jsonp に変更しました ★
        const script = document.createElement('script');
        script.id = callbackName;
        script.src = `https://is.gd/create.php?format=jsonp&url=${encodeURIComponent(longUrl)}&callback=${callbackName}`;
        
        script.onerror = function() {
            cleanup();
            showNotification("通信エラー", "インターネット接続等を確認してください。", true);
            submitBtn.innerText = "URLを短縮する";
            submitBtn.disabled = false;
        };

        document.body.appendChild(script);

        // お掃除用関数
        function cleanup() {
            clearTimeout(fallbackTimeout);
            const s = document.getElementById(callbackName);
            if (s) s.remove();
            delete window[callbackName];
        }
    }

    function copyUrl() {
        const shortUrl = document.getElementById('shortUrl').value;
        navigator.clipboard.writeText(shortUrl).then(() => {
            showNotification("コピー完了", "クリップボードにコピーしました！");
        }).catch(err => {
            showNotification("エラー", "コピーに失敗しました。手動でコピーしてください。", true);
        });
    }
</script>

</body>
</html>
